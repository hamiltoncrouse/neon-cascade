<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Neon Cascade — catch the falling neon orbs, chain combos, clear levels!">
<title>Neon Cascade</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0a0a1a;
    position: fixed; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const TITLE = 0, PLAYING = 1, GAMEOVER = 2, PAUSED = 3, LEVELCLEAR = 4, HOWTO = 5;
let gameState = TITLE;

let W = 0, H = 0, dpr = 1, safeTop = 0, safeBottom = 0, bgGrad = null;

const paddle = { x: 0, y: 0, w: 120, baseW: 120, h: 18, targetX: 0 };

let score = 0, best = 0, combo = 0, maxCombo = 0, lives = 3, playTime = 0;
let comboT = 0;
const COMBO_WINDOW = 3.5;
const MAX_LIVES = 5;
let orbs = [], powerups = [], particles = [], texts = [], bgStars = [];
let spawnTimer = 0, puTimer = 8, lastTime = 0;
let shakeT = 0, shakeMag = 0, newBest = false, gameOverAt = 0;
const effects = { wide: 0, slow: 0, x2: 0, magnet: 0 };

// Level system
let level = 1, orbsCaught = 0, orbsNeeded = 15;
let levelClearT = 0, bannerT = 0, lastBonus = 0, gainedLife = false;
let mods = null, nextMods = null;

try { best = parseInt(localStorage.getItem('nc_best') || '0', 10) || 0; } catch (e) {}

const COLORS = ['#00ffff', '#ff00ff', '#00ff66', '#ffee00', '#aa66ff'];
const GLITCH_COLOR = '#ff3344';

const PTYPES = [
  { k: 'wide',   icon: '⟷',  color: '#00ffff', dur: 8, w: 0.30 },
  { k: 'slow',   icon: '❄',  color: '#99ddff', dur: 6, w: 0.20 },
  { k: 'x2',     icon: '2×', color: '#ffee00', dur: 8, w: 0.20 },
  { k: 'magnet', icon: '◎',  color: '#ff66ff', dur: 7, w: 0.18 },
  { k: 'life',   icon: '♥',  color: '#ff5566', dur: 0, w: 0.12 }
];

// Each level past the first adds one of these twists, cycling with rising intensity
const THEMES = [
  { name: 'SPEED UP',     desc: 'Orbs fall faster',          speed: 1.25 },
  { name: 'CROSSWIND',    desc: 'Orbs drift in the wind',    wind: 70 },
  { name: 'GLITCH SWARM', desc: 'Extra red orbs — careful!', glitch: 0.12 },
  { name: 'TINY ORBS',    desc: 'Smaller, trickier orbs',    size: 0.72 },
  { name: 'ZIGZAG',       desc: 'Orbs weave wildly',         wobble: 2.6 },
  { name: 'METEOR RUSH',  desc: 'Orbs arrive in bursts',     burst: true }
];

function computeMods(lvl) {
  const m = {
    name: 'WARM UP', desc: 'Catch the falling orbs!',
    speed: 1 + (lvl - 1) * 0.07,
    glitchAdd: Math.min(0.18, (lvl - 1) * 0.012),
    wind: 0, wobble: 1, size: 1, burst: false
  };
  if (lvl >= 2) {
    const t = THEMES[(lvl - 2) % THEMES.length];
    m.name = t.name; m.desc = t.desc;
    if (t.speed) m.speed *= t.speed;
    if (t.glitch) m.glitchAdd += t.glitch;
    if (t.wind) m.wind = t.wind;
    if (t.wobble) m.wobble = t.wobble;
    if (t.size) m.size = t.size;
    if (t.burst) m.burst = true;
  }
  return m;
}

function setLevel(lvl) {
  level = lvl;
  orbsCaught = 0;
  orbsNeeded = Math.min(40, 10 + lvl * 5);
  mods = computeMods(lvl);
  bannerT = 2.4;
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  safeTop = parseFloat(cs.getPropertyValue('--sat')) || 0;
  safeBottom = parseFloat(cs.getPropertyValue('--sab')) || 0;
  paddle.y = H - 46 - Math.max(safeBottom, 16);
  paddle.baseW = Math.max(96, Math.min(160, W * 0.27));
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0a1a');
  bgGrad.addColorStop(1, '#1a0a2a');
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x || W / 2));
  paddle.targetX = paddle.x;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// --- Audio (WebAudio synth, no assets) ---
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, endFreq) {
  if (!actx || actx.state !== 'running') return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function buzz(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

// --- Pre-rendered orb sprites (gradients are too slow per-frame on mobile) ---
const spriteCache = {};
const SPRITE_R = 28, SPRITE_GLOW = 26, SPRITE_HALF = SPRITE_R + SPRITE_GLOW;
function orbSprite(color, glitch) {
  const key = color + (glitch ? 'g' : '');
  if (spriteCache[key]) return spriteCache[key];
  const S = SPRITE_HALF * 2;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(S/2, S/2, SPRITE_R * 0.2, S/2, S/2, SPRITE_HALF);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.25, color);
  grad.addColorStop(0.55, color + '88');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  g.fillStyle = color;
  g.beginPath(); g.arc(S/2, S/2, SPRITE_R, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.45)';
  g.beginPath(); g.arc(S/2 - SPRITE_R*0.3, S/2 - SPRITE_R*0.3, SPRITE_R*0.35, 0, Math.PI * 2); g.fill();
  if (glitch) {
    g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.setLineDash([6, 6]);
    g.beginPath(); g.arc(S/2, S/2, SPRITE_R + 8, 0, Math.PI * 2); g.stroke();
  }
  spriteCache[key] = c;
  return c;
}

function initStars() {
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.4,
      speed: Math.random() * 18 + 6,
      alpha: Math.random() * 0.6 + 0.2
    });
  }
}

function resetGame() {
  score = 0; combo = 0; maxCombo = 0; lives = 3; playTime = 0; comboT = 0;
  orbs = []; powerups = []; particles = []; texts = [];
  spawnTimer = 0; puTimer = 6 + Math.random() * 4;
  shakeT = 0; newBest = false;
  for (const k in effects) effects[k] = 0;
  paddle.x = W / 2; paddle.targetX = W / 2; paddle.w = paddle.baseW;
  setLevel(1);
}

function startGame() {
  resetGame();
  gameState = PLAYING;
}

function endGame() {
  gameState = GAMEOVER;
  gameOverAt = Date.now();
  newBest = score > best;
  if (newBest) {
    best = score;
    try { localStorage.setItem('nc_best', String(best)); } catch (e) {}
  }
  beep(440, 0.5, 'sawtooth', 0.15, 80);
  buzz(180);
}

function levelClear() {
  lastBonus = 100 * level;
  score += lastBonus;
  gainedLife = lives < MAX_LIVES;
  if (gainedLife) lives++;
  for (const o of orbs) if (!o.glitch) spawnParticles(o.x, o.y, o.color, 6);
  orbs = []; powerups = [];
  combo = 0; comboT = 0;
  nextMods = computeMods(level + 1);
  levelClearT = 0;
  beep(523, 0.14, 'square', 0.09);
  beep(659, 0.14, 'square', 0.09);
  beep(784, 0.25, 'square', 0.09);
  buzz([30, 30, 30, 30, 60]);
  gameState = LEVELCLEAR;
}

function advanceLevel() {
  setLevel(level + 1);
  spawnTimer = 0.8;
  gameState = PLAYING;
}

function spawnOrb() {
  const isGlitch = Math.random() < Math.min(0.34, 0.08 + mods.glitchAdd);
  const color = isGlitch ? GLITCH_COLOR : COLORS[Math.floor(Math.random() * COLORS.length)];
  const r = (Math.random() * 12 + 14) * mods.size;
  orbs.push({
    x: Math.random() * (W - 50) + 25, y: -r, r,
    speed: (70 + Math.random() * 60) * mods.speed * (1 + (orbsCaught / orbsNeeded) * 0.12),
    color, glitch: isGlitch,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: (Math.random() - 0.5) * 3 * mods.wobble
  });
}

function pickPType() {
  let r = Math.random(), acc = 0;
  for (const p of PTYPES) { acc += p.w; if (r <= acc) return p; }
  return PTYPES[0];
}

function spawnPowerup() {
  powerups.push({
    x: Math.random() * (W - 60) + 30, y: -20,
    speed: 75 + Math.random() * 30,
    type: pickPType(),
    wobble: Math.random() * Math.PI * 2
  });
}

const pool = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    if (particles.length > 240) return;
    const p = pool.pop() || {};
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 170 + 60;
    p.x = x; p.y = y;
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 60;
    p.life = 1; p.decay = Math.random() * 1.6 + 1.1;
    p.r = Math.random() * 3 + 1.5; p.color = color;
    particles.push(p);
  }
}

function addText(x, y, str, color) {
  texts.push({ x, y, str, color, life: 1 });
}

function hitPaddle(x, y, r) {
  const dx = x - Math.max(paddle.x - paddle.w/2, Math.min(x, paddle.x + paddle.w/2));
  const dy = y - Math.max(paddle.y - paddle.h/2, Math.min(y, paddle.y + paddle.h/2));
  return dx*dx + dy*dy < r*r;
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 220 * dt; p.life -= p.decay * dt;
    if (p.life <= 0) { pool.push(p); particles.splice(i, 1); }
  }
}

function updateTexts(dt) {
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.y -= 45 * dt; t.life -= dt * 1.3;
    if (t.life <= 0) texts.splice(i, 1);
  }
}

function update(dt) {
  if (gameState === PAUSED) return;

  if (gameState !== PLAYING) {
    for (const s of bgStars) {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
    updateParticles(dt);
    updateTexts(dt);
    if (shakeT > 0) shakeT -= dt;
    if (gameState === LEVELCLEAR) {
      levelClearT += dt;
      if (levelClearT > 3) advanceLevel();
    }
    return;
  }

  playTime += dt;
  const ts = effects.slow > 0 ? 0.45 : 1;
  for (const k in effects) if (effects[k] > 0) effects[k] = Math.max(0, effects[k] - dt);
  if (bannerT > 0) bannerT -= dt;

  const targetW = paddle.baseW * (effects.wide > 0 ? 1.65 : 1);
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 8);
  paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt * 18);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  if (combo > 0) {
    comboT -= dt;
    if (comboT <= 0) combo = 0;
  }

  spawnTimer -= dt * ts;
  if (spawnTimer <= 0) {
    spawnOrb();
    if (mods.burst && Math.random() < 0.35) { spawnOrb(); spawnOrb(); }
    spawnTimer = Math.max(0.3, 0.95 - level * 0.045) * (0.7 + Math.random() * 0.6);
  }
  puTimer -= dt;
  if (puTimer <= 0) {
    spawnPowerup();
    puTimer = 7 + Math.random() * 6;
  }

  const windX = mods.wind ? mods.wind * Math.sin(playTime * 0.8) : 0;

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.y += o.speed * ts * dt;
    o.wobble += o.wobbleSpeed * dt;
    o.x += Math.sin(o.wobble) * 30 * dt + windX * dt;
    if (effects.magnet > 0 && !o.glitch && o.y > H * 0.35) {
      o.x += (paddle.x - o.x) * Math.min(1, dt * 2.5);
    }
    o.x = Math.max(o.r, Math.min(W - o.r, o.x));

    if (hitPaddle(o.x, o.y, o.r)) {
      if (o.glitch) {
        lives--; combo = 0;
        shakeT = 0.35; shakeMag = 9;
        spawnParticles(o.x, o.y, GLITCH_COLOR, 18);
        addText(o.x, o.y - 20, '-1 ♥', GLITCH_COLOR);
        beep(160, 0.35, 'sawtooth', 0.18, 60);
        buzz([60, 40, 60]);
        if (lives <= 0) endGame();
      } else {
        combo++; comboT = COMBO_WINDOW;
        if (combo > maxCombo) maxCombo = combo;
        let mult = 1;
        if (effects.x2 > 0) mult *= 2;
        if (combo >= 8) mult *= 2;
        const gain = 10 * combo * mult;
        score += gain;
        spawnParticles(o.x, o.y, o.color, 10 + Math.min(combo, 12) * 2);
        addText(o.x, o.y - 16, '+' + gain, o.color);
        beep(280 + Math.min(combo, 18) * 36, 0.12, 'sine', 0.1);
        beep(560 + Math.min(combo, 18) * 36, 0.09, 'triangle', 0.05);
        buzz(12);
        orbsCaught++;
        if (orbsCaught >= orbsNeeded) {
          orbs.splice(i, 1);
          levelClear();
          return;
        }
      }
      orbs.splice(i, 1);
      continue;
    }
    if (o.y - o.r > H) {
      if (!o.glitch && combo > 0) {
        combo = 0;
        addText(o.x, H - 110, 'MISS', '#ff8888');
      }
      orbs.splice(i, 1);
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const u = powerups[i];
    u.y += u.speed * ts * dt;
    u.wobble += dt * 2;
    u.x += Math.sin(u.wobble) * 20 * dt;
    if (hitPaddle(u.x, u.y, 18)) {
      const p = u.type;
      if (p.k === 'life') {
        if (lives < MAX_LIVES) { lives++; addText(u.x, u.y - 16, '+1 ♥', p.color); }
        else { score += 200; addText(u.x, u.y - 16, '+200', p.color); }
      } else {
        effects[p.k] = p.dur;
        addText(u.x, u.y - 16, p.icon, p.color);
      }
      spawnParticles(u.x, u.y, p.color, 16);
      beep(420, 0.18, 'square', 0.1, 840);
      buzz(20);
      powerups.splice(i, 1);
      continue;
    }
    if (u.y > H + 24) powerups.splice(i, 1);
  }

  updateParticles(dt);
  updateTexts(dt);

  for (const s of bgStars) {
    s.y += s.speed * (effects.slow > 0 ? 0.5 : 1) * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  if (shakeT > 0) shakeT -= dt;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPaddle() {
  const fever = combo >= 8;
  let c1 = '#00ffff', c2 = '#0088ff';
  if (fever) {
    const h = (Date.now() * 0.2) % 360;
    c1 = 'hsl(' + h + ',100%,60%)';
    c2 = 'hsl(' + ((h + 60) % 360) + ',100%,60%)';
  }
  const pg = ctx.createLinearGradient(paddle.x - paddle.w/2, 0, paddle.x + paddle.w/2, 0);
  pg.addColorStop(0, c1); pg.addColorStop(0.5, c2); pg.addColorStop(1, c1);
  ctx.save();
  ctx.shadowColor = c1; ctx.shadowBlur = 18;
  ctx.fillStyle = pg;
  roundRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h, 9);
  ctx.fill();
  ctx.restore();
  if (effects.magnet > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,102,255,0.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(paddle.x, paddle.y, 70, Math.PI, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawPowerups() {
  for (const u of powerups) {
    ctx.save();
    ctx.fillStyle = 'rgba(10,10,30,0.85)';
    ctx.strokeStyle = u.type.color; ctx.lineWidth = 2.5;
    ctx.shadowColor = u.type.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(u.x, u.y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = u.type.color;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(u.type.icon, u.x, u.y + 1);
    ctx.restore();
  }
}

function drawTexts() {
  ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const top = safeTop + 10;
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#00ffff';
  ctx.fillText(score, 16, top + 24);
  ctx.font = '11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + best, 16, top + 40);

  ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5566';
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '♥';
  ctx.fillText(hearts, W - 14, top + 24);

  let ey = top + 46;
  ctx.font = 'bold 12px sans-serif';
  for (const p of PTYPES) {
    if (p.dur && effects[p.k] > 0) {
      ctx.fillStyle = p.color;
      ctx.fillText(p.icon + ' ' + Math.ceil(effects[p.k]), W - 14, ey);
      ey += 18;
    }
  }

  if (gameState === PLAYING || gameState === LEVELCLEAR) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(W/2 - 10, top + 6, 6, 18);
    ctx.fillRect(W/2 + 4, top + 6, 6, 18);
    ctx.textAlign = 'center';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('LV ' + level, W/2, top + 40);
    const lw = 90;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(W/2 - lw/2, top + 46, lw, 4);
    ctx.fillStyle = '#00ff66';
    ctx.fillRect(W/2 - lw/2, top + 46, lw * Math.min(1, orbsCaught / orbsNeeded), 4);
  }

  if (gameState === PLAYING && combo > 1) {
    const fever = combo >= 8;
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (fever ? 22 : 17) + 'px sans-serif';
    ctx.fillStyle = fever ? 'hsl(' + ((Date.now() * 0.2) % 360) + ',100%,65%)' : '#ff66ff';
    const cy = paddle.y - 64;
    ctx.fillText((fever ? 'FEVER ' : 'COMBO ') + 'x' + combo, W/2, cy);
    const bw = 110, frac = Math.max(0, comboT / COMBO_WINDOW);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(W/2 - bw/2, cy + 8, bw, 4);
    ctx.fillStyle = fever ? '#ffffff' : '#ff66ff';
    ctx.fillRect(W/2 - bw/2, cy + 8, bw * frac, 4);
  }
}

function drawBanner() {
  const a = Math.min(1, bannerT);
  ctx.globalAlpha = a;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 16;
  ctx.fillText('LEVEL ' + level, W/2, H * 0.30);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#ff66ff';
  ctx.fillText(mods.name, W/2, H * 0.36);
  ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(mods.desc, W/2, H * 0.41);
  ctx.globalAlpha = 1;
}

function drawTitle() {
  const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + Math.min(52, W * 0.11) + 'px sans-serif';
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 24;
  ctx.fillText('NEON CASCADE', W/2, H * 0.28);
  ctx.shadowBlur = 0;
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#ff66ff';
  ctx.fillText('Catch the falling neon orbs', W/2, H * 0.36);
  if (best > 0) {
    ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#ffee00';
    ctx.fillText('BEST: ' + best, W/2, H * 0.43);
  }
  ctx.font = 'bold 26px sans-serif';
  ctx.fillStyle = 'rgba(0,255,255,' + (0.45 + pulse * 0.55) + ')';
  ctx.fillText('TAP TO PLAY', W/2, H * 0.54);
  ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Drag anywhere to move the paddle', W/2, H * 0.64);
  ctx.fillText('Avoid red glitch orbs · Grab power-ups', W/2, H * 0.69);
  ctx.fillText('Clear the orb quota to level up!', W/2, H * 0.74);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = 'rgba(255,238,0,' + (0.6 + pulse * 0.4) + ')';
  ctx.fillText('HOW TO PLAY', W/2, H * 0.84);
}

function drawHowTo() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 16;
  ctx.fillText('HOW TO PLAY', W/2, H * 0.12);
  ctx.shadowBlur = 0;
  const lines = [
    ['Drag anywhere — the paddle follows', '#ffffff'],
    ['Catch neon orbs to score', '#00ffff'],
    ['Red dashed orbs cost a life — dodge!', '#ff5566'],
    ['Chain catches to build a combo', '#ff66ff'],
    ['Reach x8 for FEVER: double points', '#ffee00'],
    ['', ''],
    ['POWER-UPS', '#00ffff'],
    ['⟷ Wide paddle      ❄ Slow motion', '#99ddff'],
    ['2× Double score    ◎ Orb magnet', '#ffee00'],
    ['♥ Extra life (max 5)', '#ff5566'],
    ['', ''],
    ['LEVELS', '#00ffff'],
    ['Catch the orb quota to clear a level', '#00ff66'],
    ['Every level adds a new twist —', '#00ff66'],
    ['wind, bursts, tiny orbs and more!', '#00ff66']
  ];
  ctx.font = '15px sans-serif';
  let y = H * 0.19;
  for (const l of lines) {
    if (l[0]) { ctx.fillStyle = l[1]; ctx.fillText(l[0], W/2, y); }
    y += H * 0.042;
  }
  const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = 'rgba(0,255,255,' + (0.45 + pulse * 0.55) + ')';
  ctx.fillText('TAP TO START', W/2, H * 0.90);
}

function drawLevelClear() {
  ctx.fillStyle = 'rgba(5,5,15,0.65)';
  ctx.fillRect(0, 0, W, H);
  const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 36px sans-serif'; ctx.fillStyle = '#00ff66';
  ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 20;
  ctx.fillText('LEVEL ' + level + ' CLEAR!', W/2, H * 0.32);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#ffee00';
  ctx.fillText('+' + lastBonus + ' BONUS', W/2, H * 0.41);
  if (gainedLife) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#ff5566';
    ctx.fillText('+1 ♥', W/2, H * 0.47);
  }
  ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#ff66ff';
  ctx.fillText('NEXT — ' + nextMods.name, W/2, H * 0.57);
  ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(nextMods.desc, W/2, H * 0.62);
  if (levelClearT > 0.6) {
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = 'rgba(0,255,255,' + (0.45 + pulse * 0.55) + ')';
    ctx.fillText('TAP TO CONTINUE', W/2, H * 0.72);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(5,5,15,0.65)';
  ctx.fillRect(0, 0, W, H);
  const pulse = (Math.sin(Date.now() * 0.003) + 1) * 0.5;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 42px sans-serif';
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', W/2, H * 0.32);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#ffffff';
  ctx.fillText(score, W/2, H * 0.42);
  if (newBest) {
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = 'rgba(255,238,0,' + (0.5 + pulse * 0.5) + ')';
    ctx.fillText('★ NEW BEST! ★', W/2, H * 0.48);
  } else {
    ctx.font = '15px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('BEST: ' + best, W/2, H * 0.48);
  }
  ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('Level ' + level + ' · Max combo x' + maxCombo, W/2, H * 0.54);
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = 'rgba(0,255,255,' + (0.45 + pulse * 0.55) + ')';
  ctx.fillText('TAP TO PLAY AGAIN', W/2, H * 0.64);
}

function drawPaused() {
  ctx.fillStyle = 'rgba(5,5,15,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 34px sans-serif'; ctx.fillStyle = '#00ffff';
  ctx.fillText('PAUSED', W/2, H * 0.45);
  ctx.font = '16px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('Tap to resume', W/2, H * 0.53);
}

function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffffff';
  for (const s of bgStars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillRect(s.x, s.y, s.r * 2, s.r * 2);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  if (shakeT > 0) {
    const m = shakeMag * (shakeT / 0.35);
    ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
  }

  if (gameState === TITLE) {
    drawTitle();
    ctx.restore();
    return;
  }
  if (gameState === HOWTO) {
    drawHowTo();
    ctx.restore();
    return;
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) {
    const sp = orbSprite(o.color, o.glitch);
    const half = SPRITE_HALF * (o.r / SPRITE_R);
    ctx.drawImage(sp, o.x - half, o.y - half, half * 2, half * 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  drawPowerups();

  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawPaddle();
  drawTexts();
  ctx.restore();

  drawHUD();
  if (gameState === PLAYING && bannerT > 0) drawBanner();
  if (gameState === LEVELCLEAR) drawLevelClear();
  if (gameState === GAMEOVER) drawGameOver();
  if (gameState === PAUSED) drawPaused();
}

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.033);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// --- Input: single tracked pointer, drag anywhere to move ---
let activePointer = null;
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  if (activePointer === null) activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (gameState === PLAYING) {
    if (e.clientY < safeTop + 40 && Math.abs(e.clientX - W/2) < 44) {
      gameState = PAUSED;
      return;
    }
    paddle.targetX = e.clientX;
  } else if (gameState === PAUSED) {
    gameState = PLAYING;
  } else if (gameState === LEVELCLEAR) {
    if (levelClearT > 0.6) advanceLevel();
  } else if (gameState === GAMEOVER) {
    if (Date.now() - gameOverAt > 600) startGame();
  } else if (gameState === HOWTO) {
    startGame();
  } else {
    if (Math.abs(e.clientY - H * 0.84) < 28) gameState = HOWTO;
    else startGame();
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePointer) return;
  if (gameState === PLAYING) paddle.targetX = e.clientX;
});
function clearPointer(e) {
  if (e.pointerId === activePointer) activePointer = null;
}
canvas.addEventListener('pointerup', clearPointer);
canvas.addEventListener('pointercancel', clearPointer);

document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameState === PLAYING) gameState = PAUSED;
});
window.addEventListener('blur', () => {
  if (gameState === PLAYING) gameState = PAUSED;
});

initStars();
setLevel(1);
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
